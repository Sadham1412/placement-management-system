<!-- Delete Confirmation Modal (Matching Screen 15) -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content text-center p-4">
      <div class="modal-body p-0">
        <!-- Warning Icon -->
        <div class="mx-auto mb-3 bg-danger bg-opacity-10 text-danger rounded-circle d-flex align-items-center justify-content-center" style="width: 64px; height: 64px;">
          <i class="bi bi-exclamation-triangle-fill fs-2"></i>
        </div>
        
        <h4 class="fw-bold mb-2">Are you sure?</h4>
        <p class="text-muted mb-4">
          This action cannot be undone. Do you really want to delete <span id="deleteItemName" class="fw-bold text-dark">this item</span>?
        </p>

        <div class="d-flex justify-content-center gap-3">
          <button type="button" class="btn btn-light px-4 fw-medium border" data-bs-dismiss="modal">Cancel</button>
          <a id="confirmDeleteBtn" href="#" class="btn btn-danger px-4 fw-medium shadow-sm">Delete</a>
        </div>
      </div>
    </div>
  </div>
</div>
