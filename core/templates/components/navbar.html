<nav class="top-navbar d-flex justify-content-between align-items-center">
  <div class="d-flex align-items-center gap-3">
    <button class="btn btn-sm btn-light border d-lg-none" id="sidebarToggle">
      <i class="bi bi-list fs-5"></i>
    </button>
    <h5 class="m-0 fw-bold text-dark">
      {% block page_title %}Dashboard{% endblock %}
    </h5>
  </div>

  <div class="d-flex align-items-center gap-3">
    <!-- User Badge / Profile Info -->
    <div class="dropdown">
      <button class="btn btn-light bg-white border dropdown-toggle d-flex align-items-center gap-2 py-1 px-3 rounded-pill shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 32px; height: 32px; font-size: 0.85rem;">
          {{ user.first_name|default:user.username|slice:":1"|upper }}
        </div>
        <span class="fw-semibold text-dark small">
          Hello, {{ user.first_name|default:user.username }}
        </span>
        <span class="badge {% if user.is_staff %}bg-danger{% else %}bg-info text-dark{% endif %} rounded-pill" style="font-size: 0.7rem;">
          {% if user.is_staff %}Admin{% else %}Student{% endif %}
        </span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-3 mt-2">
        {% if not user.is_staff %}
          <li>
            <a class="dropdown-item py-2" href="{% url 'my_profile' %}">
              <i class="bi bi-person me-2 text-primary"></i> My Profile
            </a>
          </li>
          <li>
            <a class="dropdown-item py-2" href="{% url 'my_applications' %}">
              <i class="bi bi-file-earmark-text me-2 text-info"></i> My Applications
            </a>
          </li>
          <li><hr class="dropdown-divider"></li>
        {% endif %}
        <li>
          <a class="dropdown-item py-2 text-danger" href="{% url 'logout' %}">
            <i class="bi bi-box-arrow-right me-2"></i> Logout
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
