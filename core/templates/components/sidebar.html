{% load static %}
<aside id="sidebar" class="d-flex flex-column">
  <!-- Brand Header -->
  <div class="sidebar-brand">
    <img src="{% static 'images/logo.png' %}" alt="Logo" class="rounded-3 me-2" style="width: 36px; height: 36px; object-fit: contain;">
    <span>Placement Drive</span>
  </div>

  <!-- Navigation Menu -->
  <ul class="nav nav-pills flex-column mb-auto pt-3">
    {% if user.is_staff %}
      <!-- ADMIN NAVIGATION (Matching Screen 4) -->
      <li class="nav-item">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'student_list' %}" class="nav-link {% if 'student' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-people"></i> Students
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'company_list' %}" class="nav-link {% if 'company' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-building"></i> Companies
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'drive_list' %}" class="nav-link {% if 'drive' in request.resolver_match.url_name %}active{% endif %}">
          <i class="bi bi-briefcase"></i> Placement Drives
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'application_list' %}" class="nav-link {% if 'application' in request.resolver_match.url_name and request.resolver_match.url_name != 'my_applications' %}active{% endif %}">
          <i class="bi bi-file-earmark-check"></i> Applications
        </a>
      </li>
    {% else %}
      <!-- STUDENT NAVIGATION (Matching Screen 5) -->
      <li class="nav-item">
        <a href="{% url 'dashboard' %}" class="nav-link {% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
          <i class="bi bi-speedometer2"></i> Dashboard
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'my_profile' %}" class="nav-link {% if request.resolver_match.url_name == 'my_profile' or request.resolver_match.url_name == 'edit_profile' %}active{% endif %}">
          <i class="bi bi-person-badge"></i> My Profile
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'drive_list' %}" class="nav-link {% if request.resolver_match.url_name == 'drive_list' or request.resolver_match.url_name == 'drive_detail' %}active{% endif %}">
          <i class="bi bi-briefcase"></i> Placement Drives
        </a>
      </li>
      <li class="nav-item">
        <a href="{% url 'my_applications' %}" class="nav-link {% if request.resolver_match.url_name == 'my_applications' %}active{% endif %}">
          <i class="bi bi-file-earmark-text"></i> My Applications
        </a>
      </li>
    {% endif %}

    <li class="nav-item mt-4 pt-3 border-top border-secondary border-opacity-25">
      <a href="{% url 'logout' %}" class="nav-link text-danger">
        <i class="bi bi-box-arrow-right"></i> Logout
      </a>
    </li>
  </ul>

  <!-- Sidebar Footer -->
  <div class="p-3 text-muted small border-top border-secondary border-opacity-25" style="font-size: 0.75rem;">
    &copy; 2026 Placement Drive System
  </div>
</aside>
